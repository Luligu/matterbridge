# Build amd64 and arm64 images on native runners, then merge them into
# multi-platform Docker manifests.
name: Build Docker Image chip-test (native + manifest)

on:
  # Allow manual dispatch
  workflow_dispatch:

# Cancel previous runs when a new one is triggered
concurrency:
  group: docker-build-chip-test
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code to main branch
        uses: actions/checkout@v7

      - name: Set metadata
        id: meta
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VCS_REF=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Write build metadata to .dockerbuild.json
        run: |
          cat > .dockerbuild.json <<EOF
          {
            "version": "${{ steps.meta.outputs.VERSION }}",
            "sha": "${GITHUB_SHA}",
            "sha7": "${GITHUB_SHA::7}",
            "event": "${GITHUB_EVENT_NAME}",
            "workflow": "${GITHUB_WORKFLOW}",
            "type": "${GITHUB_REF_TYPE}",
            "name": "${GITHUB_REF_NAME}",
            "dev": false
          }
          EOF

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.platform }} image for version ${{ steps.meta.outputs.VERSION }}
        run: |
          docker build \
            --pull \
            --no-cache \
            --provenance=false \
            -f docker/Dockerfile.chip-test \
            -t luligu/matterbridge:chip-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suffix }} \
            --build-arg VERSION=${{ steps.meta.outputs.VERSION }} \
            --build-arg VCS_REF=${{ steps.meta.outputs.VCS_REF }} \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.BUILD_DATE }} \
            .
          docker push luligu/matterbridge:chip-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suffix }}
        timeout-minutes: 240

  create-manifest:
    name: Create multi-platform manifest
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code to main branch
        uses: actions/checkout@v7

      - name: Set version
        id: meta
        run: echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push manifests for version ${{ steps.meta.outputs.VERSION }}
        env:
          AMD64_IMAGE: luligu/matterbridge:chip-test-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          ARM64_IMAGE: luligu/matterbridge:chip-test-${{ github.run_id }}-${{ github.run_attempt }}-arm64
        run: |
          docker manifest create luligu/matterbridge:chip-test \
            $AMD64_IMAGE \
            $ARM64_IMAGE
          docker manifest push luligu/matterbridge:chip-test

          docker manifest create luligu/matterbridge:chip-test-${{ steps.meta.outputs.VERSION }} \
            $AMD64_IMAGE \
            $ARM64_IMAGE
          docker manifest push luligu/matterbridge:chip-test-${{ steps.meta.outputs.VERSION }}

          docker manifest inspect luligu/matterbridge:chip-test
