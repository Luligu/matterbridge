name: Update badges

on:
  # Runs daily at 03:00 UTC (scheduled runs use the workflow file on the default branch)
  schedule:
    - cron: '0 3 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Update the npm downloads and docker pulls badges in the gist
        env:
          GIST_ID: b21088ab9c9f2b119b42c33f0fef218d
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: node scripts/badges.mjs
