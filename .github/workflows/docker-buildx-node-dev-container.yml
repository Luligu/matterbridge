name: Build Docker Image node-dev-container with buildx

on:
  # Allow manual dispatch
  workflow_dispatch:

# Cancel previous runs when a new one is triggered
concurrency:
  group: docker-build-node-dev-container
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code to main branch
        uses: actions/checkout@v7

      - name: Set metadata
        id: meta
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VCS_REF=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Run Docker Buildx with Dockerfile.node-dev-container for version ${{ steps.meta.outputs.VERSION }}
        run: |
          docker buildx build \
            --no-cache \
            --pull \
            --platform linux/amd64,linux/arm64 \
            -f docker/Dockerfile.node-dev-container \
            -t luligu/matterbridge:node-dev-container \
            -t luligu/matterbridge:node-dev-container-${{ steps.meta.outputs.VERSION }} \
            --build-arg VERSION=${{ steps.meta.outputs.VERSION }} \
            --build-arg VCS_REF=${{ steps.meta.outputs.VCS_REF }} \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.BUILD_DATE }} \
            --push .
          docker manifest inspect luligu/matterbridge:node-dev-container
