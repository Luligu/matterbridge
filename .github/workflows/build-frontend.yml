name: Node.js CI - Frontend

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/frontend/**' # any file under frontend
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/frontend/**' # any file under frontend
  workflow_dispatch:

# Cancel previous runs when a new one is triggered (same branch/PR)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Verify Node.js version
        run: node -v

      - name: Verify Npm version
        run: npm -v

      - name: Install matterbridge dependencies
        run: npm ci --no-fund --no-audit

      - name: Build matterbridge
        run: npm run build

      - name: Install frontend dependencies
        run: npm ci --no-fund --no-audit
        working-directory: apps/frontend

      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: apps/frontend

      - name: Check frontend formatting
        run: npm run format:check
        working-directory: apps/frontend

      - name: Test frontend
        run: npm run test -- --testTimeout=30000
        working-directory: apps/frontend

      - name: List, audit, fix outdated dependencies, update and build again
        run: |
          npm outdated || true
          npm audit || true
          npx npm-check-updates -u || true
          npm install --no-fund --no-audit || true
          npm outdated || true
          npm audit || true
          npm run build || true
          npm run lint || true
          npm run typecheck || true
          npm run test -- --testTimeout=30000 || true
        working-directory: apps/frontend
