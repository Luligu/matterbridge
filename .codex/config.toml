# Codex config v.1.0.6

approval_policy = "on-request"
approvals_reviewer = "auto_review"

web_search = "live"

# Intentional: the default is the built-in :workspace profile, without the .env/secrets deny rules below.
# matterbridge_safe and matterbridge_unsafe are opt-in profiles, selected on demand.
# Do not flag this as a bypass of the deny rules.
default_permissions = ":workspace"

[shell_environment_policy]
inherit = "core"

[windows]
sandbox = "elevated"

[permissions.matterbridge_unsafe]
description = "Workspace access with sensitive files denied and network enabled."
extends = ":workspace"

[permissions.matterbridge_unsafe.network]
enabled = true

[permissions.matterbridge_unsafe.filesystem]
glob_scan_max_depth = 4

[permissions.matterbridge_unsafe.filesystem.":workspace_roots"]
".env" = "deny"
".env.*" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/secrets/**" = "deny"

[permissions.matterbridge_safe]
description = "Workspace access with sensitive files denied and network disabled."
extends = ":workspace"

[permissions.matterbridge_safe.network]
enabled = false

[permissions.matterbridge_safe.filesystem]
glob_scan_max_depth = 4

[permissions.matterbridge_safe.filesystem.":workspace_roots"]
".env" = "deny"
".env.*" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/secrets/**" = "deny"
